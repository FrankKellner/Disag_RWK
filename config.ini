[RWK]
; Name/Ort-Fragment (Regex) zur Bestimmung der eigenen Vereinsid aus Verein_<Jahr>.csv
Verein = Verlar
RWK_Jahr = 2026

[Pfade]
csv_ordner = RWK_CSV
mdb_vorlage = RWK_leer/RWK_leer.mdb
; Zieldatenbank: wird beim ersten Lauf aus mdb_vorlage angelegt, falls nicht vorhanden
mdb_ziel = RWK_${RWK:RWK_Jahr}/RWK_${RWK:RWK_Jahr}.mdb

[CSV_Dateien]
verein_datei = Verein_${RWK:RWK_Jahr}.csv
verein_spalten = Vereinsid,Vereinsname,Vereinsort

mannschaften_datei = Mannschaften_${RWK:RWK_Jahr}.csv
mannschaften_spalten = Mannschaftsid,Vereinsid,Mannschaftsnummer,Klassenname,Schuetze1,Schuetze2,Schuetze3,Schuetze4,Schuetze5,Schuetze6

schuetzen_datei = Schuetzen_${RWK:RWK_Jahr}.csv
schuetzen_spalten = Schuetzenid,Nachname,Vorname,Vereinsids

wettkaempfe_datei = Wettkaempfe_${RWK:RWK_Jahr}.csv
wettkaempfe_spalten = Wettkampfnummer,Runde,Datum,Klassenname,Heimvereinid,Gastvereinid

[Teams]
; Platzhalter: {klassenname}, {klasse_ohne_zahl}, {nummer}, {vereinsid}, {mannschaftsid}
teamsname_format = {klasse_ohne_zahl} - Mannschaft {nummer}
teamsnameshort_format = {klassenname}

[Sonstiges]
csv_trennzeichen = ;
csv_encoding = utf-8-sig
; Schuetzen mit mehreren Vereinen (Vereinsids "A,B") werden als mehrere Shooters-Zeilen
; angelegt; ab der 2. Zeile wird idShooters um dieses Offset * Index erhoeht.
schuetzen_id_offset = 10000000
